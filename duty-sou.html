<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Калькулятор госпошлины в суд общей юрисдикции (СОЮ) — Михаил Рачков</title>
<meta name="description" content="Онлайн-калькулятор государственной пошлины в суды общей юрисдикции (мировые судьи, районные суды) по ст. 333.19 НК РФ с выгрузкой таблицы расчёта для иска.">
<link rel="canonical" href="https://rachkov.me/duty-sou.html">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <nav class="nav-grouped">
    <div class="nav-row">
      <a href="index.html">Главная</a>
    </div>
    <div class="nav-row">
      <span class="nav-label">Калькуляторы:</span>
      <a href="395.html">Проценты по ст. 395 ГК РФ</a>
      <a href="penalty.html">Договорная неустойка</a>
      <a href="duty.html">Госпошлина в АС</a>
      <a href="duty-sou.html" class="active">Госпошлина в СОЮ</a>
    </div>
  </nav>
</div>

<div class="container">
  <div class="card">
    <div class="calc-header">
      <h1>Госпошлина в суд общей юрисдикции</h1>
      <div class="subtitle">Расчёт по актуальной редакции ст. 333.19 Налогового кодекса РФ</div>
    </div>

    <div class="form-grid">
      <div class="field">
        <label for="payerType">Статус заявителя</label>
        <select id="payerType" onchange="calculateDutySou()">
          <option value="ind" selected>Физическое лицо / ИП</option>
          <option value="org">Организация (юридическое лицо)</option>
        </select>
      </div>

      <div class="field">
        <label for="claimType">Вид обращения в суд (ст. 333.19 НК РФ)</label>
        <select id="claimType" onchange="toggleClaimFields(); calculateDutySou();">
          <option value="property" selected>Имущественный иск, подлежащий оценке</option>
          <option value="order">Заявление о выдаче судебного приказа</option>
          <option value="non_prop">Иск неимущественного характера / не подлежащий оценке</option>
          <option value="divorce">Заявление о расторжении брака</option>
          <option value="non_norm">Оспаривание ненормативных актов, решений/действий госорганов</option>
          <option value="norm">Оспаривание нормативных правовых актов</option>
          <option value="special">Заявление по делам особого производства</option>
          <option value="interim">Заявление об обеспечении иска / замене / отмене</option>
          <option value="appeal">Апелляционная / частная жалоба</option>
          <option value="cassation">Кассационная жалоба</option>
          <option value="supreme">Надзорная жалоба / кассация в Верховный Суд РФ</option>
        </select>
      </div>
    </div>

    <div class="form-grid">
      <div class="field" id="priceField">
        <label for="claimPrice">Цена иска / размер требований, ₽</label>
        <input type="number" id="claimPrice" step="0.01" min="0" placeholder="0" oninput="calculateDutySou()">
      </div>

      <div class="field">
        <label for="paidBefore">Ранее уплаченная / зачитываемая госпошлина, ₽</label>
        <input type="number" id="paidBefore" step="0.01" min="0" placeholder="0" oninput="calculateDutySou()">
      </div>
    </div>

    <label class="checkbox-row" id="addNonPropWrap">
      <input type="checkbox" id="addNonProp" onchange="calculateDutySou()">
      <span>Добавить требование неимущественного характера (пп. 1 п. 1 ст. 333.20 НК РФ)</span>
    </label>

    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top: 8px;">
      <button type="button" class="btn btn-primary" onclick="calculateDutySou()">Рассчитать госпошлину</button>
      <button type="button" class="btn btn-secondary" id="copyBtn" onclick="copyReport()" style="display:none;">Скопировать таблицу для иска</button>
    </div>

    <div class="result-card">
      <div class="result-grid">
        <div class="result-item">
          <span>Полный размер госпошлины</span>
          <strong id="resBaseDuty">0,00 ₽</strong>
        </div>
        <div class="result-item highlight">
          <span>К доплате в бюджет</span>
          <strong id="resPayableDuty">0,00 ₽</strong>
        </div>
      </div>
      <div class="note-box" id="resExplanation" style="display:none;"></div>
    </div>

    <footer>© <span id="year"></span> rachkov.me</footer>
  </div>
</div>

<script src="rates.js"></script>
<script>
document.getElementById("year").textContent = new Date().getFullYear();
let lastReportText = "";
let lastReportHtml = "";

function toggleClaimFields() {
  const type = document.getElementById("claimType").value;
  const needsPrice = (type === "property" || type === "order");
  document.getElementById("priceField").style.display = needsPrice ? "flex" : "none";
  document.getElementById("addNonPropWrap").style.display = (type === "property") ? "flex" : "none";
}

function calcSouPropertyScale(price) {
  if (price <= 0) return { duty: 0, text: "" };
  if (price <= 100000) {
    return {
      duty: 4000,
      text: "При цене иска до 100 000 руб. — фиксированная пошлина 4 000 руб."
    };
  }
  if (price <= 300000) {
    const over = price - 100000;
    const duty = Math.round(4000 + over * 0.03);
    return {
      duty,
      text: `4 000 руб. + 3% от суммы свыше 100 000 руб. (${formatMoney(over)} × 3% = ${formatMoney(over * 0.03)} руб.)`
    };
  }
  if (price <= 500000) {
    const over = price - 300000;
    const duty = Math.round(10000 + over * 0.025);
    return {
      duty,
      text: `10 000 руб. + 2,5% от суммы свыше 300 000 руб. (${formatMoney(over)} × 2,5% = ${formatMoney(over * 0.025)} руб.)`
    };
  }
  if (price <= 1000000) {
    const over = price - 500000;
    const duty = Math.round(15000 + over * 0.02);
    return {
      duty,
      text: `15 000 руб. + 2% от суммы свыше 500 000 руб. (${formatMoney(over)} × 2% = ${formatMoney(over * 0.02)} руб.)`
    };
  }
  if (price <= 3000000) {
    const over = price - 1000000;
    const duty = Math.round(25000 + over * 0.01);
    return {
      duty,
      text: `25 000 руб. + 1% от суммы свыше 1 000 000 руб. (${formatMoney(over)} × 1% = ${formatMoney(over * 0.01)} руб.)`
    };
  }
  if (price <= 8000000) {
    const over = price - 3000000;
    const duty = Math.round(45000 + over * 0.007);
    return {
      duty,
      text: `45 000 руб. + 0,7% от суммы свыше 3 000 000 руб. (${formatMoney(over)} × 0,7% = ${formatMoney(over * 0.007)} руб.)`
    };
  }
  if (price <= 24000000) {
    const over = price - 8000000;
    const duty = Math.round(80000 + over * 0.0035);
    return {
      duty,
      text: `80 000 руб. + 0,35% от суммы свыше 8 000 000 руб. (${formatMoney(over)} × 0,35% = ${formatMoney(over * 0.0035)} руб.)`
    };
  }
  if (price <= 50000000) {
    const over = price - 24000000;
    const duty = Math.round(136000 + over * 0.003);
    return {
      duty,
      text: `136 000 руб. + 0,3% от суммы свыше 24 000 000 руб. (${formatMoney(over)} × 0,3% = ${formatMoney(over * 0.003)} руб.)`
    };
  }
  if (price <= 100000000) {
    const over = price - 50000000;
    const duty = Math.round(214000 + over * 0.002);
    return {
      duty,
      text: `214 000 руб. + 0,2% от суммы свыше 50 000 000 руб. (${formatMoney(over)} × 0,2% = ${formatMoney(over * 0.002)} руб.)`
    };
  }
  const over = price - 100000000;
  const raw = Math.round(314000 + over * 0.0015);
  const duty = Math.min(900000, raw);
  return {
    duty,
    text: raw > 900000
      ? "314 000 руб. + 0,15% от суммы свыше 100 000 000 руб., но не более предельного размера 900 000 руб."
      : `314 000 руб. + 0,15% от суммы свыше 100 000 000 руб. (${formatMoney(over)} × 0,15% = ${formatMoney(over * 0.0015)} руб.)`
  };
}

function calculateDutySou() {
  const payerSelect = document.getElementById("payerType");
  const claimSelect = document.getElementById("claimType");
  const payer = payerSelect.value;
  const payerLabel = payerSelect.options[payerSelect.selectedIndex].text;
  const type = claimSelect.value;
  const claimLabel = claimSelect.options[claimSelect.selectedIndex].text;
  const price = parseFloat(document.getElementById("claimPrice").value) || 0;
  const paidBefore = parseFloat(document.getElementById("paidBefore").value) || 0;
  const addNonProp = document.getElementById("addNonProp").checked;
  const needsPrice = (type === "property" || type === "order");

  const expBox = document.getElementById("resExplanation");
  const copyBtn = document.getElementById("copyBtn");

  if (needsPrice && price <= 0 && !addNonProp) {
    document.getElementById("resBaseDuty").textContent = "0,00 ₽";
    document.getElementById("resPayableDuty").textContent = "0,00 ₽";
    expBox.style.display = "none";
    expBox.innerHTML = "";
    copyBtn.style.display = "none";
    return;
  }

  let duty = 0;
  let explanation = [];
  let normRef = "";

  if (type === "property") {
    normRef = "пп. 1 п. 1 ст. 333.19 НК РФ";
    if (price > 0) {
      const res = calcSouPropertyScale(price);
      duty = res.duty;
      explanation.push(`Имущественное требование (цена иска ${formatMoney(price)} руб., ${normRef}): ${res.text}`);
    }

    if (addNonProp) {
      const nonPropFee = payer === "org" ? 20000 : 3000;
      duty += nonPropFee;
      explanation.push(`Дополнительное неимущественное требование (пп. 3 п. 1 ст. 333.19, пп. 1 п. 1 ст. 333.20 НК РФ): +${formatMoney(nonPropFee)} руб.`);
    }
  } else if (type === "order") {
    normRef = "пп. 2 п. 1 ст. 333.19 НК РФ";
    const res = calcSouPropertyScale(price);
    duty = Math.round(res.duty * 0.5);
    explanation.push(`Заявление о выдаче судебного приказа (${normRef}): 50% от пошлины по имущественному иску (${formatMoney(res.duty)} × 50% = ${formatMoney(duty)} руб.).`);
  } else if (type === "non_prop") {
    normRef = "пп. 3 п. 1 ст. 333.19 НК РФ";
    duty = payer === "org" ? 20000 : 3000;
    explanation.push(`Исковое заявление неимущественного характера или не подлежащее оценке (${normRef}): ${formatMoney(duty)} руб.`);
  } else if (type === "divorce") {
    normRef = "пп. 5 п. 1 ст. 333.19 НК РФ";
    duty = 5000;
    explanation.push(`Заявление о расторжении брака (${normRef}): 5 000,00 руб.`);
  } else if (type === "non_norm") {
    normRef = "пп. 7 п. 1 ст. 333.19 НК РФ";
    duty = payer === "org" ? 15000 : 3000;
    explanation.push(`Оспаривание ненормативных правовых актов, решений и действий (бездействия) госорганов (${normRef}): ${formatMoney(duty)} руб.`);
  } else if (type === "norm") {
    normRef = "пп. 6 п. 1 ст. 333.19 НК РФ";
    duty = payer === "org" ? 20000 : 4000;
    explanation.push(`Оспаривание нормативных правовых актов (${normRef}): ${formatMoney(duty)} руб.`);
  } else if (type === "special") {
    normRef = "пп. 8 п. 1 ст. 333.19 НК РФ";
    duty = 3000;
    explanation.push(`Заявление по делам особого производства (${normRef}): 3 000,00 руб.`);
  } else if (type === "interim") {
    normRef = "пп. 15 п. 1 ст. 333.19 НК РФ";
    duty = 10000;
    explanation.push(`Заявление об обеспечении иска, замене или отмене обеспечительных мер (${normRef}): 10 000,00 руб.`);
  } else if (type === "appeal") {
    normRef = "пп. 19 п. 1 ст. 333.19 НК РФ";
    duty = payer === "org" ? 15000 : 3000;
    explanation.push(`Апелляционная или частная жалоба (${normRef}): ${formatMoney(duty)} руб.`);
  } else if (type === "cassation") {
    normRef = "пп. 20 п. 1 ст. 333.19 НК РФ";
    duty = payer === "org" ? 20000 : 5000;
    explanation.push(`Кассационная жалоба (${normRef}): ${formatMoney(duty)} руб.`);
  } else if (type === "supreme") {
    normRef = "пп. 21 п. 1 ст. 333.19 НК РФ";
    duty = payer === "org" ? 25000 : 7000;
    explanation.push(`Надзорная жалоба или кассационная жалоба в Верховный Суд РФ (${normRef}): ${formatMoney(duty)} руб.`);
  }

  const payable = Math.max(0, duty - paidBefore);
  if (paidBefore > 0) {
    explanation.push(`С учётом зачёта ранее уплаченной госпошлины (${formatMoney(paidBefore)} руб.) к доплате подлежит ${formatMoney(payable)} руб.`);
  }

  document.getElementById("resBaseDuty").textContent = `${formatMoney(duty)} ₽`;
  document.getElementById("resPayableDuty").textContent = `${formatMoney(payable)} ₽`;
  expBox.innerHTML = explanation.join("<br>");
  expBox.style.display = "block";
  copyBtn.style.display = "inline-flex";

  lastReportText = [
    `РАСЧЁТ ГОСУДАРСТВЕННОЙ ПОШЛИНЫ В СУД ОБЩЕЙ ЮРИСДИКЦИИ (СТ. 333.19 НК РФ)`,
    `Статус заявителя: ${payerLabel}`,
    `Вид обращения: ${claimLabel} (${normRef})`,
    needsPrice ? `Цена иска / размер требований: ${formatMoney(price)} руб.` : "",
    ``,
    ...explanation,
    ``,
    `Итого размер госпошлины: ${formatMoney(duty)} руб.`,
    paidBefore > 0 ? `Ранее уплачено / зачитывается: ${formatMoney(paidBefore)} руб.` : "",
    `К доплате в бюджет: ${formatMoney(payable)} руб.`
  ].filter(Boolean).join("\n");

  const tableRows = [
    `<tr>
      <td style="border:1px solid #000; padding:4px 6px; font-weight:bold;">Статус заявителя</td>
      <td style="border:1px solid #000; padding:4px 6px;">${payerLabel}</td>
    </tr>`,
    `<tr>
      <td style="border:1px solid #000; padding:4px 6px; font-weight:bold;">Вид обращения</td>
      <td style="border:1px solid #000; padding:4px 6px;">${claimLabel} (${normRef})</td>
    </tr>`,
    needsPrice ? `<tr>
      <td style="border:1px solid #000; padding:4px 6px; font-weight:bold;">Цена иска / размер требований</td>
      <td style="border:1px solid #000; padding:4px 6px;">${formatMoney(price)} руб.</td>
    </tr>` : "",
    `<tr>
      <td style="border:1px solid #000; padding:4px 6px; font-weight:bold;">Расчёт и обоснование</td>
      <td style="border:1px solid #000; padding:4px 6px;">${explanation.join("<br>")}</td>
    </tr>`,
    `<tr>
      <td style="border:1px solid #000; padding:4px 6px; font-weight:bold;">Полный размер госпошлины</td>
      <td style="border:1px solid #000; padding:4px 6px;"><strong>${formatMoney(duty)} руб.</strong></td>
    </tr>`,
    paidBefore > 0 ? `<tr>
      <td style="border:1px solid #000; padding:4px 6px; font-weight:bold;">Ранее уплачено / зачитывается</td>
      <td style="border:1px solid #000; padding:4px 6px;">${formatMoney(paidBefore)} руб.</td>
    </tr>` : "",
    `<tr style="background-color: #f2f2f2;">
      <td style="border:1px solid #000; padding:4px 6px; font-weight:bold;">К доплате в бюджет</td>
      <td style="border:1px solid #000; padding:4px 6px;"><strong>${formatMoney(payable)} руб.</strong></td>
    </tr>`
  ].filter(Boolean).join("");

  lastReportHtml = `
    <div style="font-family: 'Times New Roman', serif; font-size: 11pt; color: #000; width: 16.5cm;">
      <p style="font-weight: bold; margin-bottom: 8px;">РАСЧЁТ ГОСУДАРСТВЕННОЙ ПОШЛИНЫ В СУД ОБЩЕЙ ЮРИСДИКЦИИ (СТ. 333.19 НК РФ)</p>
      <table style="border-collapse: collapse; width: 16.5cm; table-layout: fixed; font-size: 10pt;">
        <colgroup>
          <col style="width: 34%;">
          <col style="width: 66%;">
        </colgroup>
        <tbody>
          ${tableRows}
        </tbody>
      </table>
    </div>
  `;
}

async function copyReport() {
  const btn = document.getElementById("copyBtn");
  const orig = btn.textContent;

  try {
    if (window.ClipboardItem) {
      const htmlBlob = new Blob([lastReportHtml], { type: "text/html" });
      const textBlob = new Blob([lastReportText], { type: "text/plain" });
      await navigator.clipboard.write([
        new ClipboardItem({
          "text/html": htmlBlob,
          "text/plain": textBlob
        })
      ]);
    } else {
      await navigator.clipboard.writeText(lastReportText);
    }
    btn.textContent = "Таблица скопирована!";
    setTimeout(() => (btn.textContent = orig), 2000);
  } catch (e) {
    await navigator.clipboard.writeText(lastReportText);
    btn.textContent = "Скопировано!";
    setTimeout(() => (btn.textContent = orig), 2000);
  }
}

toggleClaimFields();
calculateDutySou();
</script>
</body>
</html>
