name: Update CBR Key Rate

on:
  schedule:
    # Запуск каждый день в 11:00 UTC (14:00 по Москве)
    - cron: '0 11 * * *'
  workflow_dispatch: # Кнопка для ручного тестового запуска

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch CBR rate and update rates.js
        run: |
          python3 - << 'EOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import re
          from datetime import date, timedelta

          today = date.today()
          from_date = (today - timedelta(days=30)).strftime("%Y-%m-%dT00:00:00")
          to_date = (today + timedelta(days=14)).strftime("%Y-%m-%dT00:00:00")

          soap_body = f"""<?xml version="1.0" encoding="utf-8"?>
          <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                         xmlns:xsd="http://www.w3.org/2001/XMLSchema"
                         xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
            <soap:Body>
              <KeyRateXML xmlns="http://web.cbr.ru/">
                <fromDate>{from_date}</fromDate>
                <ToDate>{to_date}</ToDate>
              </KeyRateXML>
            </soap:Body>
          </soap:Envelope>"""

          req = urllib.request.Request(
              "https://www.cbr.ru/DailyInfoWebServ/DailyInfo.asmx",
              data=soap_body.encode("utf-8"),
              headers={
                  "Content-Type": "text/xml; charset=utf-8",
                  "SOAPAction": '"http://web.cbr.ru/KeyRateXML"'
              }
          )

          with urllib.request.urlopen(req, timeout=20) as resp:
              xml_data = resp.read()

          root = ET.fromstring(xml_data)
          cbr_entries = []
          for kr in root.findall(".//KR"):
              dt_raw = kr.find("DT").text[:10]
              rate_val = float(kr.find("Rate").text.replace(",", "."))
              cbr_entries.append((dt_raw, rate_val))

          cbr_entries.sort(key=lambda x: x[0])

          # Оставляем только даты, когда ставка реально менялась
          changes = []
          for dt, r in cbr_entries:
              if not changes or changes[-1][1] != r:
                  changes.append((dt, r))

          with open("rates.js", "r", encoding="utf-8") as f:
              content = f.read()

          existing = re.findall(r'\{\s*date:\s*"(\d{4}-\d{2}-\d{2})",\s*rate:\s*([\d.]+)\s*\}', content)
          if not existing:
              raise SystemExit("Не найдена таблица CBR_KEY_RATES в rates.js")

          last_date, last_rate = existing[-1][0], float(existing[-1][1])
          new_lines = []

          for dt, r in changes:
              if dt > last_date and r != last_rate:
                  new_lines.append(f'  {{ date: "{dt}", rate: {r:.2f} }}')
                  last_date, last_rate = dt, r

          if new_lines:
              pattern = r'(\{\s*date:\s*"\d{4}-\d{2}-\d{2}",\s*rate:\s*[\d.]+\s*\})(\s*\];)'
              replacement = r'\1,\n' + ',\n'.join(new_lines) + r'\2'
              updated = re.sub(pattern, replacement, content, count=1)
              with open("rates.js", "w", encoding="utf-8") as f:
                  f.write(updated)
              print("Добавлены новые ставки:", new_lines)
          else:
              print("Изменений ставки нет.")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.js
          git diff --staged --quiet || (git commit -m "Auto-update CBR key rate" && git push)
